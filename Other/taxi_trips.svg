<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
  <title id="title">Chicago taxi trips source table diagram</title>
  <desc id="desc">Selected fields from the BigQuery public taxi trips table. One row represents a recorded trip. The unique key is the candidate primary key; field types should be confirmed in BigQuery.</desc>
  <rect width="760" height="760" fill="#f7f9fc"/>
  <text x="380" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172b4d">Chicago Taxi Trips · source table</text>
  <rect x="130" y="82" width="500" height="590" rx="10" fill="#fff" stroke="#527da8" stroke-width="2"/>
  <path d="M140 82h480a10 10 0 0 1 10 10v48H130V92a10 10 0 0 1 10-10z" fill="#e6f1fb"/>
  <text x="160" y="113" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#173b5e">bigquery-public-data.chicago_taxi_trips</text>
  <text x="160" y="133" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#173b5e">.taxi_trips</text>
  <g font-family="Arial, sans-serif" font-size="15" fill="#263648">
    <text x="160" y="172" font-weight="700">KEY  unique_key</text><text x="500" y="172" fill="#68788a">STRING</text>
    <text x="160" y="207">taxi_id</text><text x="500" y="207" fill="#68788a">STRING</text>
    <text x="160" y="242">trip_start_timestamp</text><text x="500" y="242" fill="#68788a">TIMESTAMP</text>
    <text x="160" y="277">trip_end_timestamp</text><text x="500" y="277" fill="#68788a">TIMESTAMP</text>
    <text x="160" y="312">trip_seconds</text><text x="500" y="312" fill="#68788a">INTEGER</text>
    <text x="160" y="347">trip_miles</text><text x="500" y="347" fill="#68788a">FLOAT</text>
    <text x="160" y="382">pickup_community_area</text><text x="500" y="382" fill="#68788a">INTEGER</text>
    <text x="160" y="417">dropoff_community_area</text><text x="500" y="417" fill="#68788a">INTEGER</text>
    <text x="160" y="452">fare</text><text x="500" y="452" fill="#68788a">FLOAT</text>
    <text x="160" y="487">tips · tolls · extras</text><text x="500" y="487" fill="#68788a">FLOAT</text>
    <text x="160" y="522">trip_total</text><text x="500" y="522" fill="#68788a">FLOAT</text>
    <text x="160" y="557">payment_type · company</text><text x="500" y="557" fill="#68788a">STRING</text>
  </g>
  <path d="M150 584h460" stroke="#d6dee8"/>
  <text x="160" y="615" font-family="Arial, sans-serif" font-size="13" fill="#52647a">One source row = one recorded trip. Selected fields only.</text>
  <text x="160" y="638" font-family="Arial, sans-serif" font-size="13" fill="#52647a">Field types shown here are from the project model; confirm in BigQuery.</text>
</svg>
