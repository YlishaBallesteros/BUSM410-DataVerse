<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Chicago taxi trip gap with separate COVID-19 context bars</title>
  <desc id="desc">Left panel: for matched 272-day Chicago-local windows, trip counts were 16,386,009 in 2019 and 4,839,408 in 2023, a decrease of 70.5 percent. Right panel: a separate published Chicago taxi study reports approximate daily averages of 32,917 trips before COVID-19 and 1,553 during the COVID-19 crisis, a decrease of about 95.3 percent. The study series uses different periods and methodology, so it is context and not directly comparable to the project bars.</desc>
  <rect width="1200" height="690" fill="#ffffff"/>
  <text x="60" y="42" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d">Matched-period trip gap and COVID-19 context</text>
  <text x="60" y="70" font-family="Arial, sans-serif" font-size="14" fill="#53677b">One project comparison; separate study bars show pandemic-era context only.</text>

  <text x="85" y="112" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172b4d">Project data · matched 272-day windows</text>
  <text x="85" y="132" font-family="Arial, sans-serif" font-size="13" fill="#53677b">Jan 1–Sep 29 · Chicago local dates · total recorded trips</text>
  <text x="665" y="112" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172b4d">COVID-19 context · published Chicago study</text>
  <text x="665" y="132" font-family="Arial, sans-serif" font-size="13" fill="#53677b">Reported average trips per day in study periods</text>

  <g stroke="#dfe6ee" stroke-width="1">
    <line x1="120" y1="385" x2="570" y2="385"/><line x1="120" y1="328.75" x2="570" y2="328.75"/>
    <line x1="120" y1="272.5" x2="570" y2="272.5"/><line x1="120" y1="216.25" x2="570" y2="216.25"/>
    <line x1="120" y1="160" x2="570" y2="160"/>
    <line x1="700" y1="385" x2="1150" y2="385"/><line x1="700" y1="320.7" x2="1150" y2="320.7"/>
    <line x1="700" y1="256.4" x2="1150" y2="256.4"/><line x1="700" y1="192.1" x2="1150" y2="192.1"/>
    <line x1="700" y1="160" x2="1150" y2="160"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="11" fill="#5f6f80" text-anchor="end">
    <text x="112" y="389">0</text><text x="112" y="333">5m</text><text x="112" y="277">10m</text>
    <text x="112" y="221">15m</text><text x="112" y="164">20m trips</text>
    <text x="692" y="389">0</text><text x="692" y="325">10k</text><text x="692" y="261">20k</text>
    <text x="692" y="197">30k</text><text x="692" y="164">35k trips/day</text>
  </g>

  <rect x="205" y="200.7" width="125" height="184.3" rx="5" fill="#82aeca"/>
  <rect x="390" y="330.6" width="125" height="54.4" rx="5" fill="#1769aa"/>
  <text x="267.5" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172b4d">16,386,009</text>
  <text x="452.5" y="318" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172b4d">4,839,408</text>
  <text x="267.5" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#26394d">2019 benchmark</text>
  <text x="452.5" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#26394d">2023</text>

  <rect x="785" y="173.4" width="125" height="211.6" rx="5" fill="#66a182"/>
  <rect x="970" y="375.0" width="125" height="10.0" rx="4" fill="#df8a58"/>
  <text x="847.5" y="161" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172b4d">32,917</text>
  <text x="1032.5" y="362" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#172b4d">≈1,553</text>
  <text x="847.5" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#26394d">Pre-COVID-19</text>
  <text x="1032.5" y="407" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#26394d">During COVID-19</text>
  <text x="925" y="435" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#9d4e36">Study-reported decline: about 95.3%</text>

  <text x="345" y="453" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#9d443b">11,546,601 fewer trips · 70.5% decrease</text>
  <rect x="60" y="475" width="1080" height="77" rx="8" fill="#f0f5f9"/>
  <text x="85" y="503" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#172b4d">Estimated recorded-fare equivalent: $256,815,308.67</text>
  <text x="85" y="529" font-family="Arial, sans-serif" font-size="13" fill="#53677b">11,546,601 × ($142,690,533.04 / 6,415,469 fare-bearing trips) = $256,815,308.67</text>
  <text x="60" y="579" font-family="Arial, sans-serif" font-size="12" fill="#53677b">COVID-19 bars are from a separate study, with different period definitions; use them as context, not as a direct comparison to the project bars.</text>
  <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9070917/" target="_blank">
    <text x="60" y="605" font-family="Arial, sans-serif" font-size="12" fill="#1769aa" text-decoration="underline">Source: Chicago taxi mobility study (Jan–Oct 2020)</text>
  </a>
  <text x="60" y="635" font-family="Arial, sans-serif" font-size="12" fill="#6a7785">Fare equivalent uses the 2023 mean fare; it is not an observed shortfall, profit, or causal staffing impact.</text>
</svg>
