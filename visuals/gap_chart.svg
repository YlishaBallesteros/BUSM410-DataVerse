<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
  <title id="title">Matched-period Chicago taxi trips and estimated fare equivalent</title>
  <desc id="desc">The same 272 Chicago-local dates from January 1 to September 29 had 16,386,009 trips in 2019 and 4,839,408 trips in 2023, a decline of 11,546,601 trips or 70.5 percent. Applying the 2023 average recorded fare per fare-bearing trip estimates a fare equivalent of 256,815,308 dollars and 67 cents. This is not an observed fare loss.</desc>
  <rect width="1000" height="610" fill="#ffffff"/>
  <text x="90" y="43" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#172b4d">One gap: fewer taxi trips in the matched 2023 period</text>
  <text x="90" y="72" font-family="Arial, sans-serif" font-size="15" fill="#53677b">BigQuery records · Jan 1–Sep 29 · Chicago local dates · 272 days in each period</text>
  <g stroke="#dfe6ee" stroke-width="1">
    <line x1="150" y1="390" x2="850" y2="390"/>
    <line x1="150" y1="320" x2="850" y2="320"/>
    <line x1="150" y1="250" x2="850" y2="250"/>
    <line x1="150" y1="180" x2="850" y2="180"/>
    <line x1="150" y1="110" x2="850" y2="110"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" fill="#5f6f80" text-anchor="end">
    <text x="140" y="394">0</text><text x="140" y="324">5m</text><text x="140" y="254">10m</text>
    <text x="140" y="184">15m</text><text x="140" y="114">20m trips</text>
  </g>
  <rect x="300" y="160.6" width="150" height="229.4" rx="5" fill="#82aeca"/>
  <rect x="550" y="322.2" width="150" height="67.8" rx="5" fill="#1769aa"/>
  <text x="375" y="148" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172b4d">16,386,009</text>
  <text x="625" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172b4d">4,839,408</text>
  <text x="375" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#26394d">2019 benchmark</text>
  <text x="625" y="416" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#26394d">2023</text>
  <text x="500" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#9d443b">11,546,601 fewer trips · 70.5% decrease</text>
  <rect x="90" y="475" width="820" height="83" rx="8" fill="#f0f5f9"/>
  <text x="115" y="505" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#172b4d">Estimated recorded-fare equivalent: $256,815,308.67</text>
  <text x="115" y="531" font-family="Arial, sans-serif" font-size="13" fill="#53677b">11,546,601 × ($142,690,533.04 / 6,415,469 fare-bearing trips) = $256,815,308.67</text>
  <text x="90" y="585" font-family="Arial, sans-serif" font-size="12" fill="#6a7785">Estimate based on the 2023 mean fare per trip; not an observed fare shortfall, profit, or causal impact.</text>
</svg>
