  <title id="title">Chicago taxi trips by hour: matched 2019 and 2023 periods</title>
  <desc id="desc">Grouped bar chart comparing average trips per hour per local calendar day over January 1 through September 29 in 2019 and 2023. Each period covers 272 days. Every hourly bucket has lower recorded demand in 2023. Noon is the highest hour in the 2023 matched period.</desc>
